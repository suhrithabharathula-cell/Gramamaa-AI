<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./#login">
  <title>GramaMaa AI — Sign In / Login | గ్రామమా లాగిన్</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0fdfa, #f8fafc, #ecfdf5);
      color: #0f172a;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .logo {
      width: 48px;
      height: 48px;
      background: #0d9488;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #0f766e;
    }
    p {
      color: #64748b;
      font-size: 13px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      background: linear-gradient(to right, #0d9488, #059669);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      transition: transform 0.1s ease;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    .creds {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      text-align: left;
    }
    .creds p {
      margin: 4px 0;
      color: #334155;
      font-family: monospace;
    }
  </style>
  <script>
    // Automatic immediate redirect to login view
    window.location.replace('./#login');
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">♥</div>
    <h1>GramaMaa AI — Sign In</h1>
    <p>Opening the secure bilingual maternal healthcare login portal...</p>

    <a href="./#login" class="btn">Proceed to Login (లాగిన్ పేజీకి వెళ్ళండి)</a>

    <div class="creds">
      <div style="font-weight: bold; margin-bottom: 6px; color: #0f766e;">🔑 Demo Credentials:</div>
      <p><strong>Email:</strong> lakshmi@gramamaa.org</p>
      <p><strong>Mobile:</strong> 9876543210</p>
      <p><strong>Password:</strong> GramaMaa123!</p>
    </div>
  </div>
</body>
</html>
